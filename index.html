<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home | Society Brands</title>
<link rel="icon" href="image/sbi.ico">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f1;--surface:#fff;--ink:#17302b;--muted:#5d726c;--line:#dbe3de;--brand:#1f6b5c;--brand-ink:#fff;--accent:#c9a45c;--soft:#e4efe9;--shadow:0 8px 28px rgba(23,48,43,.09);--off:#f6e3c4;--offink:#7a5410;--lv:#dbe6f7;--lvink:#244a85}
[data-theme="dark"]{--bg:#12141a;--surface:#1a1d26;--ink:#eceef3;--muted:#a0a7b6;--line:#2c3140;--brand:#5cc2ad;--brand-ink:#0b1f1a;--accent:#d8b872;--soft:#242938;--shadow:0 8px 28px rgba(0,0,0,.4);--off:#4a3a1c;--offink:#f0cf8e;--lv:#23324d;--lvink:#a9c4f2}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* Header */
header{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar{max-width:1400px;margin:auto;padding:12px 20px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px}
.title{display:flex;align-items:center;gap:10px;font-family:Newsreader,Georgia,serif;font-size:1.7rem;font-weight:600;letter-spacing:-.01em;color:var(--brand);cursor:pointer;text-decoration:none}
.title img{width:36px;height:36px;object-fit:contain;flex:none}
.tools{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.search{position:relative}
.search input{width:230px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.results{position:absolute;right:0;top:110%;width:min(300px,90vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:none}
.results.open{display:block}
.results button{display:block;width:100%;padding:10px 16px;background:none;border:0;text-align:left;font-size:.92rem}
.results button:hover,.results button.active{background:var(--soft)}
.results p{padding:10px 16px;color:var(--muted);font-size:.9rem}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center}
.btn{padding:9px 20px;border-radius:999px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700}
.btn:hover{filter:brightness(1.1)}
.user{font-size:.86rem;font-weight:700;color:var(--muted);white-space:nowrap}
nav{border-top:1px solid var(--line)}
nav ul{max-width:1400px;margin:auto;padding:0 14px;list-style:none;display:flex;gap:2px;overflow-x:auto;position:relative}
nav button{background:none;border:0;padding:12px 16px;font-weight:600;color:var(--muted);white-space:nowrap;position:relative}
nav button:hover,nav button.on{color:var(--brand)}
.ind{position:absolute;left:0;bottom:0;height:3px;width:0;border-radius:3px 3px 0 0;background:var(--brand);pointer-events:none;transition:transform .6s cubic-bezier(.4,0,.2,1),width .6s cubic-bezier(.4,0,.2,1)}

/* Main */
main{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:32px 20px 48px}
.fadein{animation:fadein .9s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.vhead{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.vhead small{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.7rem;color:var(--accent)}
.vhead h2{font-family:Newsreader,Georgia,serif;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;letter-spacing:-.02em}
.vhead p{color:var(--muted);margin-top:4px}
.build{max-width:560px;margin:10px auto 0;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:30px 26px 32px;box-shadow:var(--shadow)}
.build p{color:var(--muted)}
.build svg{width:min(240px,70%);height:auto;margin:14px auto 6px;display:block}
.stroke{stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ground{stroke:var(--muted)}
.brick{fill:var(--brand);opacity:0;animation:drop 7s ease-in-out infinite}
.brick.alt{fill:var(--accent)}
@keyframes drop{0%{opacity:0;transform:translateY(-70px)}4%{opacity:1}9%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.gear.r{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hook{transform-box:fill-box;transform-origin:top center;animation:swing 2.4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(7deg)}to{transform:rotate(-7deg)}}
.status{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;margin-top:6px}
.dots span{display:inline-block;animation:dot 1.2s infinite both}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.progress{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin:18px auto 0;max-width:360px}
.progress i{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--accent),var(--brand));background-size:200% 100%;animation:bar 2.4s ease-in-out infinite alternate,shine 2s linear infinite}
@keyframes bar{from{width:18%}to{width:88%}}
@keyframes shine{to{background-position:-200% 0}}

/* Home: attendance */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;margin-bottom:24px}
.card h3{font-family:Newsreader,Georgia,serif;font-size:1.45rem;line-height:1.2}
.card .sub{color:var(--muted);font-size:.9rem}
.atop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.nav2{display:flex;gap:8px;align-items:center}
.nav2 .icon-btn{width:34px;height:34px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:12px;align-items:center}
.legend b{display:inline-block;min-width:34px;text-align:center;padding:1px 8px;border-radius:6px;margin-right:4px}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-width:100%}
table.att{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;table-layout:fixed;font-size:.72rem}
.att th,.att td{padding:2px;text-align:center;vertical-align:middle;border-bottom:1px solid var(--line);border-right:1px solid var(--line);overflow:hidden}
.att thead th{background:var(--soft);position:sticky;top:0;font-weight:800;font-size:.76rem;padding:5px 2px;line-height:1.2}
.att thead th small{display:block;font-weight:600;color:var(--muted);font-size:.58rem;text-transform:uppercase}
.att th.wk{color:var(--offink)}
.att .sk{text-align:left;background:var(--surface);padding-left:5px;white-space:normal}
.att thead th.sk{background:var(--soft)}
.att .name{font-weight:700;line-height:1.2;word-break:break-word;font-size:.74rem}
.att .k4{border-right:2px solid var(--line)}
.att tr.lob td{background:var(--soft);color:var(--brand);font-weight:800;text-align:left;letter-spacing:.04em;padding:4px 12px}
.att tr.lob td.sk{background:var(--soft)}
.ci{display:block;width:100%;height:2rem;border:1px solid transparent;background:transparent;padding:2px 4px;border-radius:6px;font-size:.64rem;line-height:1.2;resize:none;overflow-y:auto;scrollbar-width:thin;word-break:break-word}
.ci[readonly],.ci[readonly]:hover,.ci[readonly]:focus{cursor:default;border-color:transparent;background:transparent;outline:0}
.ci:hover{border-color:var(--line)}.ci:focus{border-color:var(--brand);background:var(--bg);outline:0}
.att td.today,.att th.today{box-shadow:inset 0 0 0 2px var(--accent)}
.c{display:block;width:100%;min-width:0;height:26px;line-height:26px;border:0;border-radius:6px;padding:0;font-weight:800;font-size:.72rem;text-align:center;background:var(--soft);color:var(--brand)}
.c.OFF{background:var(--off);color:var(--offink)}
.c.L{background:var(--lv);color:var(--lvink)}
.c.A{background:rgba(214,69,69,.18);color:#d64545}
.c.AW{background:rgba(170,70,190,.2);color:#b24fc9}
.c.SL{background:rgba(30,160,180,.2);color:#1a97a8}
.c.NWNP{background:rgba(130,130,130,.25);color:var(--muted);font-size:.64rem}
.c.PO{background:rgba(70,170,60,.2);color:#3d9a2e}
.c.VL{background:rgba(230,140,20,.2);color:#d98414}
.c.S{background:rgba(190,30,30,.28);color:#c23030}
.c.NONE{background:transparent;color:var(--muted);border:1px dashed var(--line);font-size:.6rem;line-height:24px;font-weight:700}
button.c{cursor:pointer}button.c:hover{filter:brightness(.94)}
.smenu .c,.legend .c{display:inline-block;height:auto;line-height:1.5;padding:1px 8px;font-size:.74rem;width:auto}
.smenu .c{width:56px;flex:none;pointer-events:none;text-align:center}
.smenu{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:grid;grid-template-columns:1fr;min-width:230px}
.smenu[hidden]{display:none}
.smenu button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:5px 8px;text-align:left;font-size:.84rem}
.smenu button:hover{background:var(--soft)}
.smenu button[hidden]{display:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block}
.form input,.form textarea{width:100%;margin-top:4px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.form .full{grid-column:1/-1}
.form textarea{min-height:100px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips span{padding:5px 12px;border-radius:999px;background:var(--soft);color:var(--brand);font-size:.8rem;font-weight:700}

/* Announcement board */
.apage{animation:fadein .45s ease both}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.acard{position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px;padding:14px 16px;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;background:var(--bg)}
.acard .atime{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.66rem;color:var(--muted)}
.acard h4{font-family:Newsreader,Georgia,serif;font-size:1.2rem;line-height:1.25;padding-right:22px}
.acard p{font-size:.88rem;white-space:pre-wrap;word-break:break-word}
.adel{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1}
.adel:hover{background:var(--soft);color:var(--brand)}
.anav{display:flex;align-items:center;justify-content:center;gap:16px;margin:0 0 14px}
.adate{font-weight:800;text-align:center;min-width:240px}
.adate small{display:block;font-weight:600;color:var(--muted);font-size:.72rem}
.icon-btn:disabled{opacity:.35;cursor:default}
.aempty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.aform{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;background:var(--bg)}
.aform .row{margin-top:12px;display:flex;gap:8px}

/* Back Office dashboards */
.bo-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.bo-tabs button{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:.76rem;letter-spacing:.06em;color:var(--muted)}
.bo-tabs button:hover{color:var(--brand);border-color:var(--brand)}
.bo-tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.dash{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:130px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.side h4{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:8px}
.side hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.side .nv{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:10px;font-weight:700;font-size:.86rem;color:var(--muted)}
.side .nv:hover{background:var(--soft);color:var(--brand)}
.side .nv.on{background:var(--brand);color:var(--brand-ink)}
.side label{display:block;font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:10px 0 4px}
.side select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.side .mini{width:100%;margin-top:12px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:.8rem}
.side .mini:hover{border-color:var(--brand);color:var(--brand)}
.dsrc{font-size:.72rem;color:var(--muted);margin-top:12px;line-height:1.4}
.dsrc i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3d9a2e;margin-right:6px}
.dsrc i.demo{background:var(--accent)}
.dbanner{padding:10px 14px;border-radius:12px;background:var(--off);color:var(--offink);font-size:.82rem;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--accent)}
.kpi span{display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:Newsreader,Georgia,serif;font-size:1.55rem;line-height:1.2;color:var(--brand);word-break:break-word}
.kpi small{color:var(--muted);font-size:.74rem}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.chart.wide{grid-column:1/-1}
.chart h5{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.cv{position:relative;height:280px}
.dwrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);overflow-x:auto}
.dwrap h5{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
table.dt{border-collapse:collapse;width:100%;font-size:.8rem}
.dt th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.dt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.dt tr:hover td{background:var(--soft)}
.dt td.num,.dt th.num{text-align:right;white-space:nowrap}
.dsearch{width:100%;max-width:340px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);margin-bottom:12px}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:.8rem;color:var(--muted)}
.pager button{padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.pager button:disabled{opacity:.4;cursor:default}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--brand);font-weight:700;font-size:.72rem}

/* Modals */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(10,18,16,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:mfade .2s ease both}
.modal[hidden]{display:none}
.mbox{width:min(420px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:26px 24px 22px;text-align:center;animation:mpop .28s cubic-bezier(.2,.9,.3,1.2) both}
.micon{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:rgba(214,69,69,.16);color:#d64545;font-weight:800;font-size:1.5rem}
.mbox h3{font-family:Newsreader,Georgia,serif;font-size:1.4rem;line-height:1.2}
.mbox p{color:var(--muted);font-size:.92rem;margin-top:6px;word-break:break-word}
.mrow{display:flex;gap:10px;justify-content:center;margin-top:20px}
.mrow button{flex:1;max-width:160px;padding:10px 16px;border-radius:999px;font-weight:700;border:1px solid var(--line)}
.mcancel{background:var(--bg);color:var(--ink)}
.mcancel:hover{background:var(--soft)}
.mdanger{background:#d64545;border-color:#d64545 !important;color:#fff}
.mdanger:hover{filter:brightness(1.08)}
.mok{background:var(--brand);border-color:var(--brand) !important;color:var(--brand-ink)}
.mok:hover{filter:brightness(1.1)}
.micon.ok{background:rgba(70,170,60,.18);color:#3d9a2e}
.cmdbox{text-align:left;width:min(520px,100%)}
.cmdbox h3{text-align:center}
.cmdbox input{width:100%;margin-top:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.9rem}
.cmdout{margin-top:10px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.76rem;color:var(--muted);white-space:pre-wrap;min-height:4.2em;word-break:break-word}
.cmddock{position:fixed;left:16px;bottom:16px;z-index:90;width:min(460px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden;animation:mpop .22s ease both}
.cmddock[hidden]{display:none}
.cmdhead{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:var(--soft);font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.cmdhead button{width:24px;height:24px;border:0;border-radius:50%;background:transparent;font-size:1.1rem;line-height:1;color:var(--muted)}
.cmdhead button:hover{background:var(--bg);color:var(--brand)}
.cmdlog{max-height:min(46vh,340px);overflow-y:auto;padding:10px 14px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.74rem;line-height:1.5;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.cmdlog:empty{display:none}
.cmdlog div{margin-bottom:6px}
.cmdlog .me{color:var(--ink);font-weight:700}
.cmdlog .err{color:#d64545}
#cmdForm{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:4px 12px}
.cmdp{color:var(--brand);font-weight:800;font-family:'JetBrains Mono',monospace}
#cmdIn{flex:1;border:0;background:transparent;padding:9px 0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.85rem;outline:0}
.adminbadge{padding:3px 10px;border-radius:999px;background:var(--accent);color:#17302b;font-size:.7rem;font-weight:800;letter-spacing:.08em}
.adminbadge[hidden]{display:none}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mpop{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}

/* Footer */
footer{border-top:1px solid var(--line);background:var(--surface)}
.foot{max-width:1400px;margin:auto;padding:8px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.foot .l{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.copy{color:var(--muted);text-decoration:none;font-weight:600}.copy:hover{color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.flink{font-size:.66rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px}.flink:hover{color:var(--brand)}
.clock{cursor:pointer;text-align:right;font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;color:var(--ink);padding:4px 10px;border:1px solid var(--line);border-radius:6px;line-height:1.25;transition:border-color .2s}
.clock:hover{border-color:var(--brand)}
.clock>div{transition:opacity .45s ease,transform .45s ease}
.clock.dim>div{opacity:0;transform:translateY(-4px)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const REQUIRE_LOGIN=false; // set to true later to send visitors to index.html if they have not logged in
const ADMIN_PW="admin";     // password for the /admin command (client-side only; real security comes with Firebase)
var boReady=false;

/* Session (set by index.html after login) */
let session=null; try{ session=JSON.parse(localStorage.getItem("sb-session")||"null"); }catch(e){}
if(REQUIRE_LOGIN&&!session){ location.replace("index.html"); }
$("#user").textContent=session?"Hi, "+session.name:"";
$("#logout").onclick=()=>{ try{ localStorage.removeItem("sb-session"); }catch(e){} location.href="index.html"; };

/* Theme */
const MOON='<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const SUN='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';
function setTheme(t){ document.documentElement.dataset.theme=t; $("#theme").innerHTML=t==="dark"?SUN:MOON; try{localStorage.setItem("sb-theme",t)}catch(e){} if(boReady) renderBO(); }
let saved=null; try{saved=localStorage.getItem("sb-theme")}catch(e){}
setTheme(saved||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("#theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

/* Confirm / notice modal */
const modal=$("#confirmModal"); let modalDone=null, modalPrevFocus=null;
let admin=false; // default: nobody can edit. Turn on with the /admin command.
function askConfirm(title,text,okLabel,o){
  o=o||{};
  return new Promise(res=>{
    const ok=o.tone==="ok", ic=$(".micon");
    $("#mTitle").textContent=title; $("#mText").textContent=text; $("#mOk").textContent=okLabel||"Confirm";
    $("#mOk").className=ok?"mok":"mdanger"; $("#mCancel").hidden=o.cancel===false;
    ic.textContent=ok?"✓":"!"; ic.classList.toggle("ok",ok);
    modalPrevFocus=document.activeElement; modal.hidden=false;
    modalDone=v=>{ modal.hidden=true; modalDone=null; if(modalPrevFocus&&modalPrevFocus.focus&&document.contains(modalPrevFocus)) modalPrevFocus.focus(); res(v); };
    (o.cancel===false?$("#mOk"):$("#mCancel")).focus();
  });
}
const notice=(t,x)=>askConfirm(t,x,"OK",{tone:"ok",cancel:false});
$("#mOk").onclick=()=>modalDone&&modalDone(true);
$("#mCancel").onclick=()=>modalDone&&modalDone(false);
modal.addEventListener("click",e=>{ if(e.target===modal&&modalDone) modalDone(false); });
document.addEventListener("keydown",e=>{
  if(!modalDone) return;
  if(e.key==="Escape"){ e.preventDefault(); modalDone(false); }
  else if(e.key==="Tab"){
    const f=[$("#mCancel"),$("#mOk")].filter(b=>!b.hidden), i=f.indexOf(document.activeElement);
    e.preventDefault(); f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus();
  }
});

/* Tabs */
const TABS=[["home","Home"],["profile","Profile"],["voice","Voice"],["chat-email","Chat/Email"],["back-office","Back Office"],["overview","Overview"],["admin-panel","Admin Panel"]];
const SUBTXT={home:"Attendance schedule for all agents.","back-office":"Live dashboards connected to Google Sheets.","admin-panel":"Admin tools are being built."};
const nav=$("#nav"), main=$("#main");
TABS.forEach(([id,name])=>{
  const li=document.createElement("li"), b=document.createElement("button"); b.textContent=name; b.dataset.id=id; b.onclick=()=>show(id); li.appendChild(b); nav.appendChild(li);
  const sec=document.createElement("section"); sec.id="v-"+id; sec.hidden=true;
  sec.innerHTML='<div class="vhead"><small>'+(id==="home"?"Welcome":"Section")+'</small><h2>'+name+'</h2>'+(SUBTXT[id]?'<p>'+(id==="home"&&session?'Welcome back, '+session.name+'! ':'')+SUBTXT[id]+'</p>':'')+'</div>';
  if(id==="home"||id==="back-office"){ const h=document.createElement("div"); h.id=id==="home"?"homeBody":"boBody"; sec.appendChild(h); }
  else sec.appendChild($("#buildTpl").content.cloneNode(true));
  main.appendChild(sec);
});
const ind=document.createElement("li"); ind.className="ind"; nav.appendChild(ind);
let firstPos=true;
function moveInd(){
  const b=document.querySelector("#nav button.on"); if(!b) return;
  if(firstPos) ind.style.transition="none";
  ind.style.width=(b.offsetWidth-28)+"px"; ind.style.transform="translateX("+(b.offsetLeft+14)+"px)";
  if(firstPos){ void ind.offsetWidth; ind.style.transition=""; firstPos=false; }
}
addEventListener("resize",()=>{ firstPos=true; moveInd(); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ firstPos=true; moveInd(); });
function show(id,keepHash){
  if(!TABS.some(t=>t[0]===id)) id="home";
  TABS.forEach(([k])=>{ $("#v-"+k).hidden=k!==id; });
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  moveInd();
  const el=$("#v-"+id); el.classList.remove("fadein"); void el.offsetWidth; el.classList.add("fadein");
  document.title=TABS.find(t=>t[0]===id)[1]+" | Society Brands";
  if(!keepHash){ try{ history.replaceState(null,"","#"+id); }catch(e){} }
  if(id==="back-office") renderBO();
  scrollTo({top:0});
}
$("#homeLink").onclick=e=>{ e.preventDefault(); show("home"); };
addEventListener("hashchange",()=>show(location.hash.slice(1),true));

/* ---------- HOME: Attendance schedule ---------- */
const LOBS=[{name:"Customer Service Team",n:0},{name:"Back Office Team",n:0}];

/* Roster: [break, name, task, shift, day-off dates in the 1-15 cut-off] */
const REF={y:2026,m:10}; // the day-off dates below are dates in November 2026 (month index 10)
/* Last cut-off that has been filled in. Every cut-off AFTER this one shows "NONE".
   When the next cut-off is ready, move this forward (e.g. {y:2026,m:10,h:1} = Nov 16-30). */
const FILLED_UNTIL={y:2026,m:10,h:0};
const cutIdx=c=>c.y*24+c.m*2+c.h;
const isFilled=c=>cutIdx(c)<=cutIdx(FILLED_UNTIL);
const ROSTER=[
[ // Customer Service
["5:00 AM - 6:00 AM","Badilla, Apple Mae","VM ALL BRANDS|Tickets [VN][CLA][CLN][PLO]","12 AM - 9 AM",[1,2,8,9,15]],
["3:00 AM - 4:00 AM","Sayawan, Christina","Tickets [VN][CLA][CLN]","12 AM - 9 AM",[1,2,8,9,15]],
["3:00 AM - 4:00 AM","Ventic, Trishia Camelle","Tickets [VN][CLA][CLN]","12 AM - 9 AM",[1,2,8,9,15]],
["3:00 AM - 4:00 AM","Domagtoy, Jenneth","VM ALL BRANDS|Tickets [VN][CLA][CLN][PLO]","12 AM - 9 AM",[1,2,8,9,15]],
["4:00 AM - 5:00 AM","Regis, Kier Vincent Veluz","Voice|Tickets [CLA][CLN][PLO][VN]|Chat","12 AM - 9 AM",[6,7,13,14]],

["3:00 PM - 4:00 PM","Malayas, Louie Jay","Voice|Tickets [CLA][CLN][PLO]|Chat","9 AM - 6 PM",[5,6,12,13]],
["11:00 PM - 12:00 AM","Carbonell, Julio Miguel","Management|Cancellation|Voice|Tickets|VN","6 AM - 3 AM",[2,3,9,10]],
["12:00 AM - 1:00 AM","Tenajeros, Rhea Vhie","Voice|Tickets [CLN][PLO][CEB][WT]|Reviews","6 AM - 3 AM",[1,7,8,14,15]],
["3:00 AM - 4:00 AM","Jabonero, Shella Mae","Voice|Tickets [CLA][CLN]","10 PM - 7 AM",[1,7,8,14,15]],
["5:00 AM - 6:00 AM","Dalion, Kevin Ray","Chat [CLA][CLN][PLO][VN]","10 PM - 7 AM",[1,7,8,14,15]],
["2:30 AM - 3:30 AM","Sumabong, Aldoresa","Voice [VN]|Tickets [CLA][CLN][VN]","10 PM - 7 AM",[1,2,8,9,15]],
["4:00 AM - 5:00 AM","Dandoy, Angelo","Voice|Tickets [CLA][CLN][PLO][VN]","10 PM - 7 AM",[1,2,8,9,15]],
["1:30 AM - 2:30 AM","Abuda, Jemyma Benedae","Voice [VN]|Tickets [CLA][CLN][VN]","10 PM - 7 AM",[3,4,10,11]],
["4:30 AM - 5:30 AM","Eleguir, Joanna Rose","Voice [VN]|Tickets [CLA][CLN][VN]","10 PM - 7 AM",[3,4,10,11]],
["1:00 AM - 2:00 AM","Navarro, Jonarose","Voice [VN]|Tickets [CLA][CLN][VN]","10 PM - 7 AM",[4,5,11,12]],
["Wkdy 1:00-2:00 AM | Wkend 2:00-3:00 AM","Atas, Leizel Den","Voice|Tickets [CLA][CLN][CEB][WT]","10 PM - 7 AM",[5,6,12,13]],
["Wkdy 4:30-5:30 AM | Wkend 4:00-5:00 AM","Vios, John Clifford II","Voice|Tickets [CLA][CLN][PLO][VN]","10 PM - 7 AM",[5,6,12,13]],
["4:30 AM - 5:30 AM","Adaptar, Marc Ryan","Management|Voice|Tickets [CLA][CLN][PLO][VN]","10 PM - 7 AM",[6,7,13,14]],
["1:30 AM - 2:30 AM","Fajardo, Carla Jean Mama","Voice [VN]|Tickets [CLA][CLN][VN]","10 PM - 7 AM",[1,7,8,14,15]],
["2:00 AM - 3:00 AM","Cabantac, Jivy","Voice|Tickets [CLA][CLN][CEB][WT]","10 PM - 7 AM",[1,7,8,14,15]],
["2:00 AM - 3:00 AM","Cavan, Hannah Mae","Voice [VN]|Tickets [CLA][CLN][VN]","10 PM - 7 AM",[1,7,8,14,15]],
["3:00 AM - 4:00 AM","Morante, Leonyl Jan","Voice [VN]|Tickets [CLA][CLN][VN]","10 PM - 7 AM",[1,7,8,14,15]],
["3:30 AM - 4:30 AM","Andao, Ferrie Mae","Voice [VN]|Tickets [CLA][CLN][VN]","10 PM - 7 AM",[1,7,8,14,15]]
],
[ // Back Office
["Anytime After 4 Hours","Panilag, Zethsu","Management|Dispute Resolution","10 PM - 7 AM",[1,7,8,14,15]],
["Anytime After 4 Hours","Ablao, Bryan","Dispute Resolution","10 PM - 7 AM",[1,7,8,14,15]],

["Anytime After 4 Hours","Naranjo, Mikka Francine","Returns|RMA|Address Verification","10 PM - 7 AM",[1,7,8,14,15]],
["Anytime After 4 Hours","Sumagui, Mark Allen","QA","12 AM - 9 AM",[1,2,8,9,15]]
]];

/* Each agent's day offs repeat weekly (e.g. 1,2,8,9,15 = every Sun + Mon) */
const AGENTS=[];
ROSTER.forEach((list,li)=>{
  LOBS[li].n=list.length;
  list.forEach(r=>{
    const wd=[...new Set(r[4].map(d=>new Date(REF.y,REF.m,d).getDay()))];
    AGENTS.push({id:AGENTS.length+1,lob:li,b:r[0],name:r[1],t:r[2],s:r[3],off:wd});
  });
});

let info={}; try{ info=JSON.parse(localStorage.getItem("sb-info2")||"{}"); }catch(e){}
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const pad2=n=>String(n).padStart(2,"0");
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const STATUSES=[["P","Present"],["OFF","Day off"],["A","Absent"],["AW","AWOL"],["SL","Sick Leave"],["NWNP","No Work No Pay"],["PO","Paid Off"],["VL","Vacation Leave"],["S","Suspension"],["L","Leave"]];
let store={}; try{ store=JSON.parse(localStorage.getItem("sb-att2")||"{}"); }catch(e){}
const today=new Date();
let cut={y:2026,m:10,h:0}; // opens on November 2026, 1-15 (h: 0 = 1-15, 1 = 16-end); "Current cut-off" jumps to today
const key=(a,y,m,d)=>a.id+"|"+y+"-"+(m+1)+"-"+d;
function defStatus(a,y,m,d){ const w=new Date(y,m,d).getDay(); const off=a.off&&a.off.length?a.off.includes(w):(w===0||w===6); return off?"OFF":"P"; }
const isToday=(y,m,d)=>y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();
function shiftCut(n){ let t=cut.m*2+cut.h+n; cut.y+=Math.floor(t/24); t=((t%24)+24)%24; cut.m=Math.floor(t/2); cut.h=t%2; renderHome(); }

function renderHome(){
  const {y,m,h}=cut, last=new Date(y,m+1,0).getDate(), from=h?16:1, to=h?last:15, nd=to-from+1, filled=isFilled(cut), ro=admin?'':' readonly';
  let thead='<tr><th class="sk k1">Break Time</th><th class="sk name">Agent</th><th class="sk k3">Task</th><th class="sk k4">Shift</th>', body='';
  for(let d=from;d<=to;d++){ const w=new Date(y,m,d).getDay(); thead+='<th class="'+((w===0||w===6)?'wk ':'')+(isToday(y,m,d)?'today':'')+'">'+d+'<small>'+DAYS[w]+'</small></th>'; }
  thead+='</tr>';
  const cg='<colgroup><col style="width:10%"><col style="width:12%"><col style="width:19%"><col style="width:7.5%">'+'<col>'.repeat(nd)+'</colgroup>';
  LOBS.forEach((l,li)=>{
    body+='<tr class="lob"><td class="sk k1" colspan="4">'+l.name+' ('+l.n+')</td><td colspan="'+nd+'"></td></tr>';
    AGENTS.filter(a=>a.lob===li).forEach(a=>{
      const f=Object.assign({b:a.b,t:a.t,s:a.s},info[a.id]||{});
      body+='<tr><td class="sk k1"><textarea class="ci" rows="2" data-a="'+a.id+'" data-f="b" placeholder="Break time" aria-label="Break time"'+ro+'>'+esc(f.b)+'</textarea></td><td class="sk name">'+esc(a.name)+'</td><td class="sk k3"><textarea class="ci" rows="2" data-a="'+a.id+'" data-f="t" placeholder="Task" aria-label="Task"'+ro+'>'+esc(f.t)+'</textarea></td><td class="sk k4"><textarea class="ci" rows="2" data-a="'+a.id+'" data-f="s" placeholder="Shift" aria-label="Shift"'+ro+'>'+esc(f.s)+'</textarea></td>';
      for(let d=from;d<=to;d++){
        const k=key(a,y,m,d), s=store[k]||(filled?defStatus(a,y,m,d):"NONE");
        body+='<td class="'+(isToday(y,m,d)?'today':'')+'">'+(admin?'<button class="c '+s+'" data-k="'+k+'" data-a="'+a.id+'" data-d="'+d+'" title="Click to change">'+s+'</button>':'<span class="c '+s+'">'+s+'</span>')+'</td>';
      }
      body+='</tr>';
    });
  });
  const range=MONTHS[m]+" "+from+" – "+to+", "+y;
  $("#homeBody").innerHTML=
  '<div class="card"><div class="atop"><div><h3>Attendance Schedule</h3><div class="sub">Cut-off: '+range+' · '+AGENTS.length+' agents'+(filled?'':' · Not yet filled')+'</div></div>'+
  '<div class="nav2"><button class="icon-btn" id="prevC" aria-label="Previous cut-off">‹</button><button class="btn" id="nowC">Current cut-off</button><button class="icon-btn" id="nextC" aria-label="Next cut-off">›</button></div></div>'+
  '<div class="twrap"><table class="att">'+cg+'<thead>'+thead+'</thead><tbody>'+body+'</tbody></table></div>'+
  '<div class="legend">'+STATUSES.map(s=>'<span><b class="c '+s[0]+'">'+s[0]+'</b>'+s[1]+'</span>').join('')+'<span><b class="c NONE">NONE</b>Not yet filled</span><span>'+(admin?'Admin mode: click a cell to choose a status. ':'')+'Gold outline = today.</span></div></div>'+
  '<div class="card" id="annCard"></div>'+
  '<div class="card"><h3>Summary &amp; Announcements</h3><p class="sub" style="margin-top:6px">Welcome to Society Brands. This page tracks who is on the floor for the current cut-off across Voice, Chat/Email and Back Office. Each agent’s weekly day offs are pre-filled as OFF; individual changes, leaves and absences can only be set by an admin. Daily announcements from the manager are posted on the bulletin board above.</p>'+
  '<div class="chips"><span>Planned: export to Excel/CSV</span><span>Planned: late &amp; absent tracking</span><span>Planned: schedule change requests</span><span>Planned: monthly attendance summary</span></div></div>';
  $("#prevC").onclick=()=>shiftCut(-1); $("#nextC").onclick=()=>shiftCut(1);
  $("#nowC").onclick=()=>{ cut={y:today.getFullYear(),m:today.getMonth(),h:today.getDate()<=15?0:1}; renderHome(); };
  renderAnn();
}

/* ---------- Bulletin board: daily announcements ---------- */
let ann=[]; try{ ann=JSON.parse(localStorage.getItem("sb-ann")||"[]"); }catch(e){}

function csv(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=""}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows}

  const H=R[hi].map(x=>x.trim()), ix={}, used=new Set();
  Object.keys(COLS).forEach(k=>{ const j=H.findIndex((h,j)=>h&&!used.has(j)&&COLS[k].test(h)); if(j>=0){ ix[k]=j; used.add(j); } });
  if(cols){ Object.keys(ix).forEach(k=>{ if(ix[k]===cols.id||ix[k]===cols.rc) delete ix[k]; }); ix.id=cols.id; ix.root=cols.rc; }
  const out=[];

    if(!r.some(c=>c.trim())) return;
    const g=k=>ix[k]==null?"":(r[ix[k]]||"").trim(); let mo=pm(g("date")); if(cols){ if(!g("id")) return; mo=mo||{k:"0000-00",l:"No date"}; } else if(!mo) return;

    out.push({m:mo.l,mk:mo.k,b:g("brand"),p:g("product"),rs:g("reason"),rc:g("root"),mid:g("mid"),st:g("status"),amt:a?parseFloat(a)||0:0,t:type==="Dispute"?"Dispute":(tv?(/ship/i.test(tv)?"Reship":"Refund"):type),id:g("id")});
  });

  const ds={label:c.label||"Records",data:c.data,backgroundColor:pie?c.labels.map((_,i)=>PAL[i%PAL.length]):(line?"rgba(31,107,92,.15)":PAL[0]),borderColor:line?PAL[0]:(pie?cs.getPropertyValue("--surface").trim():undefined),borderWidth:pie?2:(line?3:0),fill:line,tension:.3,borderRadius:h||c.type==="bar"?6:0,pointRadius:line?3:0};
  const catAxis={ticks:{color:ink,callback(v){return short(String(this.getLabelForValue(v)))}},grid:{display:false}}, valAxis={ticks:{color:ink},grid:{color:grid},beginAtZero:true};
  BO_CH.push(new Chart(el,{type:h?"bar":c.type,data:{labels:c.labels,datasets:[ds]},options:{indexAxis:h?"y":"x",maintainAspectRatio:false,animation:{duration:600},plugins:{legend:{display:pie,position:"right",labels:{color:ink,boxWidth:12,font:{size:11},generateLabels(ch){return ch.data.labels.map((l,i)=>({text:short(String(l))+" ("+ch.data.datasets[0].data[i]+")",fillStyle:PAL[i%PAL.length],strokeStyle:"transparent",fontColor:ink,index:i}))}}}},scales:pie?{}:(h?{y:catAxis,x:valAxis}:{x:catAxis,y:valAxis})}}));
}
function fillContent(k){
  BO_CH.forEach(c=>c.destroy()); BO_CH=[];
  const rows=filtered(k), ch=[], el=$("#dc"), st=BO.st[k], d=D[k];
  let h=d.demo?'<div class="dbanner">⚠ Could not read the Google Sheet ('+esc(d.err)+'). Showing demo data so you can preview the dashboard. Check that the sheet is shared as “Anyone with the link can view” and that the tab name is right (admin: <b>/sheet</b> command).</div>':"";
  h+=rows.length||st.p.match(/detail|refunds|reships/)?pageHtml(k,rows,ch):'<div class="aempty">No records match the selected filters.</div>';
  el.innerHTML=h; ch.forEach(mkChart);
  if($("#dtab")) recTable(k);
}
function renderBO(){
  const el=$("#boBody"); if(!el) return; boReady=true; BO_CH.forEach(c=>c.destroy()); BO_CH=[];
  let h='<div class="bo-tabs">'+SUBS.map(s=>'<button data-sub="'+s[0]+'" class="'+(BO.sub===s[0]?'on':'')+'">'+s[1]+'</button>').join('')+'</div>';
  const k=BO.sub;
  if(k==="dispute"||k==="refund"){
    const d=D[k], st=BO.st[k];
    if(d.state==="idle"){ loadDash(k); }
    const opt=(arr,v)=>'<option value="">All</option>'+arr.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===v?' selected':'')+'>'+esc(x[1])+'</option>').join('');
    const mo=[...new Set(d.rows.map(r=>r.mk))].sort().reverse().map(x=>[x,MLAB[x]||x]), br=[...new Set(d.rows.map(r=>r.b).filter(Boolean))].sort().map(x=>[x,x]), mi=[...new Set(d.rows.map(r=>r.mid).filter(Boolean))].sort().map(x=>[x,x]);
    h+='<div class="dash"><aside class="side"><h4>Navigation</h4>'+PAGES[k].map(p=>'<button class="nv'+(st.p===p[0]?' on':'')+'" data-p="'+p[0]+'">'+p[1]+'</button>').join('')+'<hr><h4>Filters</h4>'+
      '<label for="fM">Filed month</label><select id="fM" data-f="m">'+opt(mo,st.m)+'</select><label for="fB">Brand</label><select id="fB" data-f="b">'+opt(br,st.b)+'</select><label for="fD">MID</label><select id="fD" data-f="d">'+opt(mi,st.d)+'</select>'+
      '<button class="mini" id="bReset">Reset filters</button><button class="mini" id="bReload">↻ Refresh data</button>'+
      '<div class="dsrc">'+(d.state==="loading"?'Loading from Google Sheets…':'<i class="'+(d.demo?'demo':'')+'"></i>'+(d.demo?'Demo data':(d.imported?'Imported: '+esc(d.imported):'Live from Google Sheets'))+' · '+d.rows.length+' records')+'</div></aside><div id="dc">'+(d.state==="ready"?'':'<div class="aempty">Loading data from Google Sheets…</div>')+'</div></div>';
    el.innerHTML=h; if(d.state==="ready") fillContent(k);
  } else { el.innerHTML=h+$("#buildTpl").innerHTML; }
}
$("#boBody").addEventListener("click",e=>{
  const t=e.target, k=BO.sub, st=BO.st[k];
  const sb=t.closest("[data-sub]"); if(sb){ BO.sub=sb.dataset.sub; renderBO(); return; }
  const nv=t.closest(".nv"); if(nv){ st.p=nv.dataset.p; st.pg=0; renderBO(); return; }
  if(t.closest("#bReset")){ st.m=st.b=st.d=st.q=""; st.pg=0; renderBO(); return; }
  if(t.closest("#bReload")){ loadDash(k,true); return; }
  const pg=t.closest("[data-pg]"); if(pg){ st.pg+=+pg.dataset.pg; recTable(k); }
});
$("#boBody").addEventListener("change",e=>{ const s=e.target.closest("select[data-f]"); if(!s) return; const st=BO.st[BO.sub]; st[s.dataset.f]=s.value; st.pg=0; fillContent(BO.sub); });
$("#boBody").addEventListener("input",e=>{ if(e.target.id!=="bq") return; const st=BO.st[BO.sub]; st.q=e.target.value; st.pg=0; recTable(BO.sub); });

/* ---------- Command box (press / or \) ---------- */
const cmdM=$("#cmdModal"), cmdIn=$("#cmdIn"), cmdLog=$("#cmdLog");
function say(t,cls){ const d=document.createElement("div"); if(cls) d.className=cls; d.textContent=t; cmdLog.appendChild(d); cmdLog.scrollTop=cmdLog.scrollHeight; }
const cmdOut={set textContent(t){ say(t,/^(Wrong|Unknown|Admin mode is required|Usage)/.test(t)?"err":""); }};
const HELP="Available commands:\n/help  – show all commands\n/admin <password>  – turn on admin mode (edit, change, delete)\n/admin off  – turn off admin mode\n/sheet <dispute|refund> <tab name>  – set the Google Sheet tab (admin only)\n/import <dispute|refund>  – load a CSV exported from the sheet (admin only)\n/reload  – reload the Back Office data\n/clear  – clear this box\n\nOpen/close: press / and \\ together. Esc closes.";
const openCmd=()=>{ cmdM.hidden=false; setTimeout(()=>cmdIn.focus(),0); if(!cmdLog.childElementCount) say("Type /help to see all commands."); };
const closeCmd=()=>{ cmdM.hidden=true; };
function setAdmin(v){ admin=v; $("#adminBadge").hidden=!v; if(!v){ annForm=false; menu.hidden=true; } renderHome(); }
function runCmd(raw){
  const p=raw.replace(/^[\/\\]/,"").trim().split(/\s+/), c=(p[0]||"").toLowerCase(), a=p.slice(1);
  if(c==="help"||c===""){ cmdOut.textContent=HELP; }
  else if(c==="clear"){ cmdLog.innerHTML=""; }
  else if(c==="admin"){
    if(!a.length) cmdOut.textContent="Usage: /admin <password>   or   /admin off";
    else if(a[0].toLowerCase()==="off"&&a.length===1){ if(!admin) cmdOut.textContent="Admin mode is already off."; else{ setAdmin(false); notice("Admin mode deactivated","Everything is read-only again."); } }
    else if(a.join(" ")===ADMIN_PW){ setAdmin(true); notice("Admin mode activated","You can now edit, change and delete content on this website. Type /admin off to deactivate."); }
    else cmdOut.textContent="Wrong password.";
  }
  else if(c==="sheet"){
    const k=(a[0]||"").toLowerCase();
    if(!admin) cmdOut.textContent="Admin mode is required. Use /admin <password>.";
    else if(!SRC[k]||a.length<2) cmdOut.textContent="Usage: /sheet dispute <tab name>\n       /sheet refund <refund tab> | <reship tab>";
    else{
      const parts=a.slice(1).join(" ").split("|").map(x=>x.trim()).filter(Boolean);
      SRC[k].tabs=k==="dispute"?{Dispute:parts[0]}:(parts.length>1?{Refund:parts[0],Reship:parts[1]}:{Refund:parts[0]});
      try{ const o=JSON.parse(localStorage.getItem("sb-tabs")||"{}"); o[k]=SRC[k].tabs; localStorage.setItem("sb-tabs",JSON.stringify(o)); }catch(e){}
      D[k].state="idle"; cmdOut.textContent="Tab set to: "+Object.values(SRC[k].tabs).join(" | ")+". Loading…"; if(BO.sub===k) renderBO(); else loadDash(k);
    }
  }
  else if(c==="import"){
    const k=(a[0]||"").toLowerCase();
    if(!admin) cmdOut.textContent="Admin mode is required. Use /admin <password>.";
    else if(!SRC[k]) cmdOut.textContent="Usage: /import dispute   or   /import refund";
    else{
      const f=document.createElement("input"); f.type="file"; f.accept=".csv,text/csv";
      f.onchange=()=>{ const file=f.files[0]; if(!file) return; file.text().then(t=>{ try{
        const n=norm(t,k==="dispute"?"Dispute":"Refund","file",SRC[k].cols), d=D[k];
        d.rows=n.rows; d.hasAmt=n.hasAmt; d.demo=false; d.err=""; d.state="ready"; d.imported=file.name; BO.st[k].pg=0;
        cmdOut.textContent="Imported "+n.rows.length+" records from "+file.name+"."; if(BO.sub===k) renderBO();
      }catch(e){ cmdOut.textContent="Unknown file: "+e.message; } }); };
      f.click(); cmdOut.textContent="Choose the CSV file (File > Download > CSV on the Dispute tab)…";
    }
  }
  else if(c==="reload"){ ["dispute","refund"].forEach(k=>{ if(D[k].state!=="idle") loadDash(k,true); }); cmdOut.textContent="Reloading Back Office data…"; }
  else cmdOut.textContent="Unknown command “"+raw+"”. Type /help.";
}
cmdIn.addEventListener("keydown",e=>{ if(e.key!=="Enter"||e.isComposing) return; e.preventDefault(); const v=cmdIn.value.trim(); cmdIn.value=""; if(v) say("› "+v,"me"); runCmd(v); });
$("#cmdClose").onclick=closeCmd;
const held=new Set();
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(!cmdM.hidden) closeCmd(); menu.hidden=true; return; }
  if(e.key==="/"||e.key==="\\"){
    held.add(e.key);
    if(held.has("/")&&held.has("\\")&&!modalDone){ e.preventDefault(); held.clear(); cmdM.hidden?openCmd():closeCmd(); }
  }
});
document.addEventListener("keyup",e=>{ held.delete(e.key); });
addEventListener("blur",()=>held.clear());

renderHome();
show(location.hash.slice(1)||"home",true);

/* Search: jump to a section */
const box=$("#results"), input=$("#q"); let shown=[], act=-1;
function render(v){
  box.innerHTML=""; act=-1;
  if(!v){ box.classList.remove("open"); shown=[]; return; }
  shown=TABS.filter(t=>t[1].toLowerCase().includes(v));
  if(!shown.length) box.innerHTML="<p>No results found.</p>";
  shown.forEach((t,i)=>{ const b=document.createElement("button"); b.textContent=t[1]; b.onclick=()=>pick(i); box.appendChild(b); });
  box.classList.add("open");
}
function pick(i){ const t=shown[i]; if(!t) return; box.classList.remove("open"); input.value=""; input.blur(); show(t[0]); }
function mark(i){ const bs=[...box.querySelectorAll("button")]; bs.forEach((b,k)=>b.classList.toggle("active",k===i)); act=i; }
input.addEventListener("input",e=>render(e.target.value.trim().toLowerCase()));
input.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); if(shown.length) mark((act+1)%shown.length); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); if(shown.length) mark((act-1+shown.length)%shown.length); }
  else if(e.key==="Enter"){ e.preventDefault(); if(shown.length) pick(act>=0?act:0); }
  else if(e.key==="Escape") box.classList.remove("open");
});
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) box.classList.remove("open"); });

/* Clock: Philippine Standard Time / Pacific Time (click to switch) */
const ZONES=[{tz:"Asia/Manila",label:"Philippine Standard Time"},{tz:"America/Los_Angeles",label:"Pacific Time (US & Canada)"}];
let zi=0, busy=false;
function tick(){
  const d=new Date(), z=ZONES[zi], tz={timeZone:z.tz};
  $("#ckLabel").textContent=z.label;
  $("#ckTime").textContent=d.toLocaleTimeString("en-US",{...tz,hour12:true,hour:"2-digit",minute:"2-digit",second:"2-digit"});
  $("#ckDate").textContent=d.toLocaleDateString("en-US",{...tz,month:"2-digit",day:"2-digit",year:"numeric"})+" | ("+d.toLocaleDateString("en-US",{...tz,weekday:"long"})+")";
}
const flip=()=>{ if(busy) return; busy=true; $("#clock").classList.add("dim"); setTimeout(()=>{ zi=(zi+1)%ZONES.length; tick(); $("#clock").classList.remove("dim"); setTimeout(()=>busy=false,450); },450); };
$("#clock").onclick=flip;
$("#clock").addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); } });
tick(); setInterval(tick,1000);

/* Back to top */
const toTop=$("#toTop"); addEventListener("scroll",()=>toTop.classList.toggle("show",scrollY>300),{passive:true});
toTop.onclick=()=>scrollTo({top:0,behavior:"smooth"});
</script>
