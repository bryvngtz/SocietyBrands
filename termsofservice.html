<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terms of Service | Society Brands</title>
<link rel="icon" href="image/sbi.ico">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f1;--surface:#fff;--ink:#17302b;--muted:#5d726c;--line:#dbe3de;--brand:#1f6b5c;--brand-ink:#fff;--accent:#c9a45c;--soft:#e4efe9;--shadow:0 8px 28px rgba(23,48,43,.09)}
[data-theme="dark"]{--bg:#12141a;--surface:#1a1d26;--ink:#eceef3;--muted:#a0a7b6;--line:#2c3140;--brand:#5cc2ad;--brand-ink:#0b1f1a;--accent:#d8b872;--soft:#242938;--shadow:0 8px 28px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s}
header{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar{max-width:1200px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.title{display:flex;align-items:center;gap:10px;font-family:Newsreader,Georgia,serif;font-size:1.6rem;font-weight:600;color:var(--brand);text-decoration:none}
.title img{width:34px;height:34px;object-fit:contain}
.back{padding:9px 20px;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-weight:700;text-decoration:none;font-size:.9rem}
.back:hover{filter:brightness(1.1)}
main{flex:1;display:grid;place-items:center;padding:40px 20px}
.card{width:min(560px,100%);text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:36px 28px 34px;box-shadow:var(--shadow);animation:in .8s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
h1{font-family:Newsreader,Georgia,serif;font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.15;letter-spacing:-.02em}
.card p{color:var(--muted);margin-top:10px}
svg{width:min(260px,70%);height:auto;margin:18px auto 6px;display:block}
.stroke{stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ground{stroke:var(--muted)}
.brick{fill:var(--brand);opacity:0;animation:drop 7s ease-in-out infinite}
.brick.alt{fill:var(--accent)}
@keyframes drop{0%{opacity:0;transform:translateY(-70px)}4%{opacity:1}9%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.gear.r{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hook{transform-box:fill-box;transform-origin:top center;animation:swing 2.4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(7deg)}to{transform:rotate(-7deg)}}
.status{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;margin-top:6px}
.dots span{display:inline-block;animation:dot 1.2s infinite both}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.progress{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin:18px auto 0;max-width:360px}
.progress i{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--accent),var(--brand));background-size:200% 100%;animation:bar 2.4s ease-in-out infinite alternate,shine 2s linear infinite}
@keyframes bar{from{width:18%}to{width:88%}}
@keyframes shine{to{background-position:-200% 0}}
footer{border-top:1px solid var(--line);background:var(--surface);text-align:center;padding:12px;font-size:.76rem;color:var(--muted)}
footer a{color:inherit;text-decoration:none;font-weight:600}
footer a:hover{color:var(--brand)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.brick{opacity:1}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="title" href="index.html"><img src="image/sbi.ico" alt="" onerror="this.remove()"><span>Society Brands</span></a>
    <a class="back" href="index.html">← Back to home</a>
  </div>
</header>

<main>
  <section class="card">
    <span class="tag">Legal</span>
    <h1>Terms of Service</h1>
    <p>This page is currently being built. Please check back soon.</p>

    <svg viewBox="0 0 240 180" role="img" aria-label="Animated construction scene">
      <!-- ground -->
      <path class="stroke ground" d="M10 160H230"/>
      <!-- crane -->
      <path class="stroke" d="M190 160V30M178 160H202M190 30H80M190 30L150 8H190M80 30V44"/>
      <g class="hook"><path class="stroke" d="M80 44V74"/><path class="stroke" d="M72 74H88"/></g>
      <!-- bricks (stack up in turn) -->
      <g>
        <rect class="brick" style="animation-delay:0s"   x="40"  y="140" width="34" height="20" rx="3"/>
        <rect class="brick alt" style="animation-delay:.4s" x="76"  y="140" width="34" height="20" rx="3"/>
        <rect class="brick" style="animation-delay:.8s"  x="112" y="140" width="34" height="20" rx="3"/>
        <rect class="brick alt" style="animation-delay:1.2s" x="58"  y="118" width="34" height="20" rx="3"/>
        <rect class="brick" style="animation-delay:1.6s" x="94"  y="118" width="34" height="20" rx="3"/>
        <rect class="brick alt" style="animation-delay:2s" x="76"  y="96"  width="34" height="20" rx="3"/>
      </g>
      <!-- gears -->
      <g class="gear" style="color:var(--accent)"><circle cx="34" cy="60" r="13" fill="none" stroke="currentColor" stroke-width="7" stroke-dasharray="5 5"/><circle cx="34" cy="60" r="9" fill="var(--surface)" stroke="currentColor" stroke-width="3"/></g>
      <g class="gear r" style="color:var(--brand)"><circle cx="58" cy="78" r="9" fill="none" stroke="currentColor" stroke-width="6" stroke-dasharray="4 4"/><circle cx="58" cy="78" r="6" fill="var(--surface)" stroke="currentColor" stroke-width="2.5"/></g>
    </svg>

    <div class="status">Currently building<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    <div class="progress" aria-hidden="true"><i></i></div>
  </section>
</main>

<footer><a href="https://bryangablao.github.io/Accxs-Creations/" target="_blank" rel="noopener noreferrer">© Accxs Creations 2026</a></footer>

<script>
(function(){
  var t=null; try{ t=localStorage.getItem("sb-theme"); }catch(e){}
  if(!t) t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t;
})();
</script>
</body>
</html>
